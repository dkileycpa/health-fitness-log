<script>






(() => {
  const { useState, useEffect, useCallback, useRef, useMemo } = React;
  const {

  const { LineChart, Line, XAxis, YAxis, Tooltip, Legend, ResponsiveContainer, CartesianGrid } = window.Recharts;
  const CLIENT_ID = "242814993883-qubuj093i89cliq097qb89em016h5cfe.apps.googleusercontent.com";
  const SPREADSHEET_ID = "19JalMbLch7TlUqduehJWctz0EabC1akRuoEgLpDG2xU";
  const SCOPES = "https://www.googleapis.com/auth/spreadsheets";
  const TOKEN_KEY = "x3log_access_token_v3";
  const TOKEN_EXPIRY_KEY = "x3log_token_expiry_v3";
  const USDA_API_KEY = "DEMO_KEY";
  const UNCATEGORIZED_ID = "__uncategorized__";
  const OZ_TO_G = 28.3495;
  const BANDS = [
    { id: "none", label: "None", short: "\u2014", swatch: "transparent", dot: "#9CA3AF" },
    { id: "wp", label: "White", short: "W", swatch: "#F4F2EC", dot: "#F4F2EC" },
    { id: "lgp", label: "Light Grey", short: "LG", swatch: "#B9BCC2", dot: "#B9BCC2" },
    { id: "dgp", label: "Dark Grey", short: "DG", swatch: "#5C6068", dot: "#5C6068" },
    { id: "bp", label: "Black", short: "B", swatch: "#232529", dot: "#232529" },
    { id: "bwp", label: "Black + White", short: "B+W", swatch: "linear-gradient(135deg, #232529 50%, #F4F2EC 50%)", dot: "#232529" },
    { id: "blgp", label: "Black + Light Grey", short: "B+LG", swatch: "linear-gradient(135deg, #232529 50%, #B9BCC2 50%)", dot: "#232529" },
    { id: "bgp", label: "Black + Dark Grey", short: "B+DG", swatch: "linear-gradient(135deg, #232529 50%, #5C6068 50%)", dot: "#232529" }
  ];
  function computeSessionId(dateStr, routine) {
    if (!routine || !routine.name) return `session_${dateStr.replace(/-/g, "")}`;
    const words = routine.name.trim().split(/\s+/);
    const first = words[0].toLowerCase();
    const last = words[words.length - 1];
    return `session_${dateStr.replace(/-/g, "")}_${first}_${last}`;
  }
  function sessionDateFromEntry(e) {
    if (e && e.sessionId) {
      const parts = e.sessionId.split("_");
      if (parts.length >= 2 && /^\d{8}$/.test(parts[1])) {
        const d = parts[1];
        return `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6, 8)}`;
      }
    }
    // Fallback only when there's no usable sessionId -- entries created before
    // session_id existed, or any other edge case where the cleaner identity
    // isn't available.
    return e && e.timestamp ? toDateStr(new Date(e.timestamp)) : null;
  }
  function bandById(id) {
    return BANDS.find((b) => b.id === id) || BANDS[0];
  }
  const METRIC_DEFS = [
    { key: "weight", label: "Weight", unit: "lb", decimals: 1, step: "0.1", group: "morning" },
    { key: "sleep", label: "Sleep", unit: "hr", decimals: 1, step: "0.1", group: "morning", inputType: "time" },
    { key: "sleepScore", label: "Sleep Score", unit: "", decimals: 0, step: "1", group: "morning" },
    { key: "readiness", label: "Readiness", unit: "", decimals: 0, step: "1", group: "morning" },
    { key: "hrv", label: "HRV", unit: "ms", decimals: 0, step: "1", group: "morning" },
    { key: "rhr", label: "RHR", unit: "bpm", decimals: 0, step: "1", group: "morning" },
    { key: "sleepHrLow", label: "Sleep HR Low", unit: "bpm", decimals: 0, step: "1", group: "morning" },
    { key: "sleepHrAvg", label: "Sleep HR Avg", unit: "bpm", decimals: 0, step: "1", group: "morning" },
    { key: "steps", label: "Steps", unit: "", decimals: 0, step: "1", group: "nutrition" },
    { key: "protein", label: "Protein", unit: "g", decimals: 0, step: "1", group: "nutrition" },
    { key: "calories", label: "Calories", unit: "kcal", decimals: 0, step: "1", group: "nutrition" }
  ];
  const TREND_PALETTE = ["#f97316", "#22d3ee", "#a78bfa", "#34d399", "#f472b6", "#fbbf24", "#60a5fa", "#fb7185"];
  function computeFoodNutrition(food, grams) {
    const factor = grams / 100;
    return {
      protein: Math.round(food.proteinPer100g * factor * 10) / 10,
      calories: Math.round(food.caloriesPer100g * factor),
      fat: Math.round((food.fatPer100g || 0) * factor * 10) / 10,
      carbs: Math.round((food.carbsPer100g || 0) * factor * 10) / 10
    };
  }
  function computeDayNutritionTotals(dayEntries, foods) {
    let protein = 0, calories = 0, fat = 0, carbs = 0;
    dayEntries.forEach((e) => {
      if (e.foodId) {
        const food = foods.find((f) => f.id === e.foodId);
        if (!food) return;
        const n = computeFoodNutrition(food, e.amountGrams);
        protein += n.protein;
        calories += n.calories;
        fat += n.fat;
        carbs += n.carbs;
      } else if (e.adhocProtein !== null || e.adhocCalories !== null) {
        protein += e.adhocProtein || 0;
        calories += e.adhocCalories || 0;
        fat += e.adhocFat || 0;
        carbs += e.adhocCarbs || 0;
      }
    });
    return {
      protein: Math.round(protein * 10) / 10,
      calories: Math.round(calories),
      fat: Math.round(fat * 10) / 10,
      carbs: Math.round(carbs * 10) / 10
    };
  }

    // ============================= DAILY FUELING GAP =============================
  // Centralized, tunable configuration. Individualization by weight/goal/training
  // day/calorie target/recovery status is intentionally NOT built yet -- this
  // shape just leaves room for it later.
  const NUTRITION_TARGETS_CONFIG = {
    calories: { low: 1700, high: 1900 },
    protein: { low: 150, high: 175 },
    fat: { low: 55, high: 70 }
    // Carbs deliberately has no fixed range -- see getNutritionTargets().
  };

  // Centralized, documented scoring weights. Nothing below is a "magic number"
  // buried inline -- every constant used by scoreNutritionPortion() lives here.
  // NOTE: there is deliberately no gram/mass-based penalty here. Food quantity
  // (grams) is not used as a nutrition-quality signal -- doing so would
  // systematically favor calorie-dense foods over high-volume ones, which has
  // nothing to do with whether a food is a good fit for the remaining gap. If
  // a "practicality" preference (e.g. avoiding oddly large single portions)
  // is wanted later, it should be a separate, explicit, deferred concern --
  // not folded into this score.
  const FOOD_SCORE_WEIGHTS = {
    proteinDeficitWeight: 15,      // reward per gram of protein while still below the low target
    proteinAdequateWeight: 0.3,    // reward per gram of protein once adequate (much lower)
    proteinOvershootPenalty: 1.5,  // penalty per gram pushing protein past what's still useful
    fatDeficitWeight: 15,
    fatAdequateWeight: 0.3,
    fatOvershootPenalty: 1.5,
    carbUsefulWeight: 1,           // reward per gram of carbs as flexible energy
    carbRunDayMultiplier: 1.5,     // boost for carbs on run/strength_run days
    calorieFitWeight: 1,           // reward per useful kcal toward the remaining-low gap
    calorieOvershootPenalty: 2     // penalty per kcal pushing the day's total past the high target
  };

  const FUELING_GAP_CONFIG = {
    wellFueledCalorieBuffer: 50,     // if remaining-low calories <= this, treat as satisfied
    minGramStep: 10,                 // smallest quantity increment considered
    maxCandidateGrams: 200,          // never recommend more than this of one food
    quantityCandidatesG: [10, 15, 20, 25, 30, 40, 50, 60, 75, 85, 100, 113, 125, 150, 170, 200],
    shortlistSize: 6,                // how many single-food candidates advance to combo search
    variantsPerFood: 3,              // how many distinct quantity variants per shortlisted food
                                      // are made available to the combination search, instead of
                                      // locking each food to a single isolated-optimum quantity
    maxResults: 3,                   // BEST FIT + up to 2 ALTERNATIVEs
    // A single recommendation should read like "a sensible next thing to eat".
    // These caps bound how much of the *remaining gap* a single recommendation
    // is rewarded for covering, independent of how much gap actually remains.
    maxUsefulCaloriesPerRec: 600,
    maxUsefulProteinPerRec: 40,
    maxUsefulFatPerRec: 25,
    maxUsefulCarbsPerRec: 60
  };

  function getNutritionTargets(dayType) {
    // dayType is accepted now so callers don't need to change later, but V1
    // does not yet vary targets by day type -- see spec section 2.
    return NUTRITION_TARGETS_CONFIG;
  }

  function calculateNutritionGap(totals, targets) {
    return {
      caloriesRemainingLow: targets.calories.low - totals.calories,
      caloriesRemainingHigh: targets.calories.high - totals.calories,
      proteinRemainingLow: targets.protein.low - totals.protein,
      proteinRemainingHigh: targets.protein.high - totals.protein,
      fatRemainingLow: targets.fat.low - totals.fat,
      fatRemainingHigh: targets.fat.high - totals.fat
    };
  }

  function computeAdequacy(totals, targets) {
    return {
      proteinAdequate: totals.protein >= targets.protein.low,
      fatAdequate: totals.fat >= targets.fat.low
    };
  }

  // "Well fueled" requires calories to be reasonably satisfied AND both protein
  // and fat minimums met. Hitting the calorie ceiling alone does NOT count --
  // see calculateFlexibleCarbRange() / computeDailyFuelingGap() for how a
  // calories-capped-but-macros-short day is represented separately.
  function isWellFueled(totals, gap, targets) {
    const adequacy = computeAdequacy(totals, targets);
    const caloriesSatisfied = gap.caloriesRemainingLow <= FUELING_GAP_CONFIG.wellFueledCalorieBuffer;
    return caloriesSatisfied && adequacy.proteinAdequate && adequacy.fatAdequate;
  }

  // Carbohydrate is the flexible nutrient that fills remaining energy needs
  // AFTER minimum protein and fat are accounted for -- not simply "remaining
  // calories / 4", which would falsely assume every remaining calorie should
  // come from carbohydrate even when protein/fat minimums haven't been met yet.
  function calculateFlexibleCarbRange(gap) {
    const proteinCaloriesNeeded = Math.max(0, gap.proteinRemainingLow) * 4;
    const fatCaloriesNeeded = Math.max(0, gap.fatRemainingLow) * 9;
    const flexibleLow = Math.max(0, gap.caloriesRemainingLow - proteinCaloriesNeeded - fatCaloriesNeeded);
    const flexibleHigh = Math.max(flexibleLow, gap.caloriesRemainingHigh - proteinCaloriesNeeded - fatCaloriesNeeded);
    return { carbsRemainingLow: flexibleLow / 4, carbsRemainingHigh: Math.max(flexibleLow, flexibleHigh) / 4 };
  }

  // Scores a nutrition delta (a single food portion OR a combined multi-food
  // total) against the remaining gap. Nutrients already adequate get scored at
  // a much lower weight than nutrients still below their minimum, and overshoot
  // past the day's high target is penalized -- this is the one place scoring
  // logic lives, reused for both single foods and combinations.
  function scoreNutritionPortion(nutrition, gap, totals, targets, dayType) {
    const W = FOOD_SCORE_WEIGHTS;
    const G = FUELING_GAP_CONFIG;
    const adequacy = computeAdequacy(totals, targets);
    let score = 0;

    const proteinNeeded = Math.min(Math.max(0, gap.proteinRemainingLow), G.maxUsefulProteinPerRec);
    const proteinUseful = Math.min(nutrition.protein, proteinNeeded);
    const proteinExcess = nutrition.protein - proteinUseful;
    score += proteinUseful * (adequacy.proteinAdequate ? W.proteinAdequateWeight : W.proteinDeficitWeight);
    score -= proteinExcess * (adequacy.proteinAdequate ? W.proteinOvershootPenalty : W.proteinOvershootPenalty * 0.3);

    const fatNeeded = Math.min(Math.max(0, gap.fatRemainingLow), G.maxUsefulFatPerRec);
    const fatUseful = Math.min(nutrition.fat, fatNeeded);
    const fatExcess = nutrition.fat - fatUseful;
    score += fatUseful * (adequacy.fatAdequate ? W.fatAdequateWeight : W.fatDeficitWeight);
    score -= fatExcess * (adequacy.fatAdequate ? W.fatOvershootPenalty : W.fatOvershootPenalty * 0.3);

    const runDay = dayType === "run" || dayType === "strength_run";
    const carbWeight = W.carbUsefulWeight * (runDay ? W.carbRunDayMultiplier : 1) * (adequacy.proteinAdequate && adequacy.fatAdequate ? 1 : 0.5);
    const carbsUseful = Math.min(nutrition.carbs, G.maxUsefulCarbsPerRec);
    score += carbsUseful * carbWeight;

    const caloriesAfter = totals.calories + nutrition.calories;
    if (caloriesAfter <= targets.calories.high) {
      const usefulCalorieCap = Math.min(Math.max(0, gap.caloriesRemainingLow), G.maxUsefulCaloriesPerRec);
      const usefulCalories = Math.min(nutrition.calories, usefulCalorieCap);
      score += usefulCalories * W.calorieFitWeight;
    } else {
      const overshoot = caloriesAfter - targets.calories.high;
      score -= overshoot * W.calorieOvershootPenalty;
    }

    return score;
  }

  // For each live food, scores a capped set of gram quantities and keeps the
  // top few DISTINCT-scoring variants (not just the single best) so the
  // combination search below can consider more than one quantity per food.
  function generateFoodCandidates(liveFoods, gap, totals, targets, dayType) {
    const perFoodVariants = [];
    liveFoods.forEach((food) => {
      const scored = [];
      const grams = FUELING_GAP_CONFIG.quantityCandidatesG.concat(food.defaultGrams || 100);
      grams.forEach((g) => {
        if (g < FUELING_GAP_CONFIG.minGramStep || g > FUELING_GAP_CONFIG.maxCandidateGrams) return;
        const nutrition = computeFoodNutrition(food, g);
        const score = scoreNutritionPortion(nutrition, gap, totals, targets, dayType);
        scored.push({ food, grams: g, nutrition, score });
      });
      scored.sort((a, b) => b.score - a.score);

      const topVariants = [];
      for (const s of scored) {
        if (topVariants.length >= FUELING_GAP_CONFIG.variantsPerFood) break;
        // Skip near-duplicate scores at a different quantity -- keeps the
        // variant set meaningfully distinct rather than padded with
        // essentially-identical options.
        const isDuplicate = topVariants.some((v) => Math.abs(v.score - s.score) < 0.01);
        if (isDuplicate) continue;
        topVariants.push(s);
      }

      if (topVariants.length && topVariants[0].score > 0) {
        perFoodVariants.push({ food, variants: topVariants, bestScore: topVariants[0].score });
      }
    });
    perFoodVariants.sort((a, b) => b.bestScore - a.bestScore);
    return perFoodVariants;
  }

  function sumNutrition(parts) {
    return parts.reduce(
      (acc, p) => ({
        protein: Math.round((acc.protein + p.nutrition.protein) * 10) / 10,
        calories: Math.round(acc.calories + p.nutrition.calories),
        fat: Math.round((acc.fat + p.nutrition.fat) * 10) / 10,
        carbs: Math.round((acc.carbs + p.nutrition.carbs) * 10) / 10
      }),
      { protein: 0, calories: 0, fat: 0, carbs: 0 }
    );
  }

  // Takes the strongest single-food candidates only (shortlistSize), then
  // evaluates 1/2/3-food combinations using EVERY retained quantity variant
  // for each shortlisted food -- not a single quantity fixed in isolation.
  // Still bounded: shortlistSize=6 foods x variantsPerFood=3 keeps this to a
  // few hundred cheap sum+score evaluations at most.
  function findBestFoodCombinations(candidates, gap, totals, targets, dayType) {
    const shortlist = candidates.slice(0, FUELING_GAP_CONFIG.shortlistSize);
    const results = [];

    shortlist.forEach((c) => {
      c.variants.forEach((v) => {
        results.push({ parts: [v], nutrition: v.nutrition, score: v.score });
      });
    });

    for (let i = 0; i < shortlist.length; i++) {
      for (let j = i + 1; j < shortlist.length; j++) {
        shortlist[i].variants.forEach((vi) => {
          shortlist[j].variants.forEach((vj) => {
            const parts = [vi, vj];
            const nutrition = sumNutrition(parts);
            const score = scoreNutritionPortion(nutrition, gap, totals, targets, dayType);
            results.push({ parts, nutrition, score });
          });
        });
      }
    }

    for (let i = 0; i < shortlist.length; i++) {
