<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>X3LOG — Manage (Stage 1)</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#0a0a0a; color:#fafafa; font-family: -apple-system, sans-serif; }
  ::-webkit-scrollbar { display:none; }
  #boot-error { padding:16px; color:#f87171; font-size:12px; white-space:pre-wrap; word-break:break-word; }
</style>
</head>
<body class="text-neutral-50">
<div id="root"><div style="padding:16px;color:#a3a3a3;">Loading…</div></div>
<div id="boot-error"></div>

<script>
  function showBootError(msg) {
    var el = document.getElementById("boot-error");
    if (el) el.textContent = "Error: " + msg;
    console.error(msg);
  }
  window.onerror = function (message, source, lineno, colno, error) {
    showBootError(message + " (line " + lineno + ")");
  };
  window.addEventListener("unhandledrejection", function (e) {
    showBootError("Unhandled promise rejection: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  window.__stage1Booted = false;
  setTimeout(function () {
    if (!window.__stage1Booted) {
      showBootError(
        "Boot check failed after 4s.\n" +
        "React loaded: " + (typeof React !== "undefined") + "\n" +
        "ReactDOM loaded: " + (typeof ReactDOM !== "undefined") + "\n" +
        "Babel loaded: " + (typeof Babel !== "undefined") + "\n" +
        "Google Identity Services loaded: " + (typeof google !== "undefined" && !!(google && google.accounts))
      );
    }
  }, 4000);
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

const CLIENT_ID = "242814993883-qubuj093i89cliq097qb89em016h5cfe.apps.googleusercontent.com";
const SPREADSHEET_ID = "19JalMbLch7TlUqduehJWctz0EabC1akRuoEgLpDG2xU";
const SCOPES = "https://www.googleapis.com/auth/spreadsheets";

function genId(prefix) {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
}

// ---- Sheets API helpers ----
function useSheetsApi(accessToken) {
  const authHeaders = { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" };

  async function getRange(range) {
    const res = await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}`,
      { headers: authHeaders }
    );
    if (!res.ok) throw new Error(`Read failed (${res.status}): ${await res.text()}`);
    const data = await res.json();
    return data.values || [];
  }

  async function clearRange(range) {
    const res = await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}:clear`,
      { method: "POST", headers: authHeaders }
    );
    if (!res.ok) throw new Error(`Clear failed (${res.status}): ${await res.text()}`);
  }

  async function updateRange(range, values) {
    if (values.length === 0) return;
    const res = await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=RAW`,
      { method: "PUT", headers: authHeaders, body: JSON.stringify({ values }) }
    );
    if (!res.ok) throw new Error(`Write failed (${res.status}): ${await res.text()}`);
  }

  return { getRange, clearRange, updateRange };
}

// ---- Main App ----
function App() {
  const [accessToken, setAccessToken] = useState(null);
  const [tokenClient, setTokenClient] = useState(null);
  const [routines, setRoutines] = useState([]);
  const [loading, setLoading] = useState(false);
  const [saveState, setSaveState] = useState("idle"); // idle | saving | saved | error
  const [errorMsg, setErrorMsg] = useState(null);
  const [manageRenaming, setManageRenaming] = useState(null);
  const [expandedRoutine, setExpandedRoutine] = useState({});
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [newRoutineName, setNewRoutineName] = useState("");
  const [newExName, setNewExName] = useState({});
  const [newExUnit, setNewExUnit] = useState({});

  const api = useSheetsApi(accessToken);

  useEffect(() => {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: (resp) => {
        if (resp.error) {
          setErrorMsg("Sign-in failed: " + JSON.stringify(resp));
          return;
        }
        setAccessToken(resp.access_token);
      },
    });
    setTokenClient(client);
  }, []);

  const loadData = useCallback(async () => {
    setLoading(true);
    setErrorMsg(null);
    try {
      const routineRows = await api.getRange("Routines!A2:C10000");
      const exerciseRows = await api.getRange("Exercises!A2:F10000");

      const loadedRoutines = routineRows
        .filter((r) => r[0])
        .map((r) => ({ id: r[0], name: r[1] || "", sortOrder: parseInt(r[2], 10) || 0, exercises: [] }))
        .sort((a, b) => a.sortOrder - b.sortOrder);

      const byRoutine = {};
      exerciseRows
        .filter((r) => r[0])
        .forEach((r) => {
          const ex = {
            id: r[0],
            routineId: r[1],
            name: r[2] || "",
            unit: r[3] || "seconds",
            archived: r[4] === "TRUE" || r[4] === "true" || r[4] === true,
            sortOrder: parseInt(r[5], 10) || 0,
          };
          if (!byRoutine[ex.routineId]) byRoutine[ex.routineId] = [];
          byRoutine[ex.routineId].push(ex);
        });
      for (const key in byRoutine) byRoutine[key].sort((a, b) => a.sortOrder - b.sortOrder);

      loadedRoutines.forEach((r) => {
        r.exercises = byRoutine[r.id] || [];
      });

      setRoutines(loadedRoutines);
    } catch (e) {
      setErrorMsg(String(e));
    } finally {
      setLoading(false);
    }
  }, [accessToken]);

  useEffect(() => {
    if (accessToken) loadData();
  }, [accessToken, loadData]);

  // Save the FULL current routines+exercises state back to the Sheet.
  const saveTimeout = React.useRef(null);
  function persist(nextRoutines) {
    if (saveTimeout.current) clearTimeout(saveTimeout.current);
    saveTimeout.current = setTimeout(async () => {
      setSaveState("saving");
      try {
        const routineRows = nextRoutines.map((r, i) => [r.id, r.name, i]);
        const exerciseRows = [];
        nextRoutines.forEach((r) => {
          r.exercises.forEach((ex, i) => {
            exerciseRows.push([ex.id, r.id, ex.name, ex.unit || "seconds", ex.archived ? "TRUE" : "FALSE", i]);
          });
        });
        await api.clearRange("Routines!A2:C10000");
        await api.clearRange("Exercises!A2:F10000");
        if (routineRows.length) await api.updateRange("Routines!A2", routineRows);
        if (exerciseRows.length) await api.updateRange("Exercises!A2", exerciseRows);
        setSaveState("saved");
        setTimeout(() => setSaveState("idle"), 1500);
      } catch (e) {
        setSaveState("error");
        setErrorMsg(String(e));
      }
    }, 500);
  }

  function updateRoutines(updater) {
    setRoutines((prev) => {
      const next = updater(prev);
      persist(next);
      return next;
    });
  }

  function addRoutine() {
    const name = newRoutineName.trim();
    if (!name) return;
    updateRoutines((prev) => [...prev, { id: genId("routine"), name, exercises: [] }]);
    setNewRoutineName("");
  }
  function deleteRoutine(routineId) {
    updateRoutines((prev) => prev.filter((r) => r.id !== routineId));
    setConfirmDelete(null);
  }
  function renameRoutine(routineId, name) {
    if (!name.trim()) return;
    updateRoutines((prev) => prev.map((r) => (r.id === routineId ? { ...r, name: name.trim() } : r)));
    setManageRenaming(null);
  }
  function addExercise(routineId) {
    const name = (newExName[routineId] || "").trim();
    if (!name) return;
    const unit = newExUnit[routineId] || "seconds";
    updateRoutines((prev) =>
      prev.map((r) =>
        r.id === routineId
          ? { ...r, exercises: [...r.exercises, { id: genId("ex"), name, unit, archived: false }] }
          : r
      )
    );
    setNewExName((prev) => ({ ...prev, [routineId]: "" }));
  }
  function renameExercise(routineId, exId, name) {
    if (!name.trim()) return;
    updateRoutines((prev) =>
      prev.map((r) =>
        r.id === routineId
          ? { ...r, exercises: r.exercises.map((ex) => (ex.id === exId ? { ...ex, name: name.trim() } : ex)) }
          : r
      )
    );
    setManageRenaming(null);
  }
  function toggleArchive(routineId, exId, archived) {
    updateRoutines((prev) =>
      prev.map((r) =>
        r.id === routineId
          ? { ...r, exercises: r.exercises.map((ex) => (ex.id === exId ? { ...ex, archived } : ex)) }
          : r
      )
    );
  }
  function toggleUnit(routineId, exId) {
    updateRoutines((prev) =>
      prev.map((r) =>
        r.id === routineId
          ? {
              ...r,
              exercises: r.exercises.map((ex) =>
                ex.id === exId ? { ...ex, unit: (ex.unit || "seconds") === "seconds" ? "reps" : "seconds" } : ex
              ),
            }
          : r
      )
    );
  }
  function moveExercise(routineId, exId, direction) {
    updateRoutines((prev) =>
      prev.map((r) => {
        if (r.id !== routineId) return r;
        const idx = r.exercises.findIndex((ex) => ex.id === exId);
        const swapIdx = idx + direction;
        if (idx < 0 || swapIdx < 0 || swapIdx >= r.exercises.length) return r;
        const exercises = [...r.exercises];
        [exercises[idx], exercises[swapIdx]] = [exercises[swapIdx], exercises[idx]];
        return { ...r, exercises };
      })
    );
  }

  if (!accessToken) {
    return (
      <div className="max-w-md mx-auto p-6">
        <h1 className="text-xl font-bold mb-4">X3LOG — Manage (Stage 1 test)</h1>
        <button
          onClick={() => tokenClient && tokenClient.requestAccessToken()}
          className="w-full py-3 rounded-lg bg-orange-500 text-neutral-950 font-semibold"
        >
          Sign in with Google
        </button>
        {errorMsg && <div className="text-red-400 text-xs mt-3 whitespace-pre-wrap">{errorMsg}</div>}
      </div>
    );
  }

  return (
    <div className="max-w-md mx-auto p-4 pb-16">
      <div className="flex items-center justify-between mb-4">
        <h1 className="text-xl font-bold">Manage</h1>
        <span className="text-xs text-neutral-400">
          {saveState === "saving" && "Saving…"}
          {saveState === "saved" && "Saved ✓"}
          {saveState === "error" && "Save failed"}
        </span>
      </div>

      {loading && <div className="text-neutral-400 text-sm mb-4">Loading from Sheet…</div>}
      {errorMsg && <div className="text-red-400 text-xs mb-4 whitespace-pre-wrap">{errorMsg}</div>}

      <div className="space-y-4">
        {routines.map((r) => {
          const isExpanded = expandedRoutine[r.id] === true;
          const liveCount = r.exercises.filter((ex) => !ex.archived).length;
          return (
            <div key={r.id} className="bg-neutral-900 border border-neutral-800 rounded-2xl p-4">
              <div className="flex items-center justify-between mb-2">
                {manageRenaming === `routine-${r.id}` ? (
                  <RenameInline initial={r.name} onSave={(name) => renameRoutine(r.id, name)} onCancel={() => setManageRenaming(null)} />
                ) : (
                  <>
                    <button
                      onClick={() => setExpandedRoutine((prev) => ({ ...prev, [r.id]: prev[r.id] !== true }))}
                      className="flex items-center gap-2 min-w-0 flex-1 text-left"
                    >
                      <span className="text-neutral-400 shrink-0">{isExpanded ? "▾" : "▸"}</span>
                      <span className="font-bold truncate">{r.name}</span>
                      <span className="text-xs text-neutral-500 shrink-0">{liveCount} movement{liveCount === 1 ? "" : "s"}</span>
                    </button>
                    <div className="flex items-center gap-1 shrink-0">
                      <button onClick={() => setManageRenaming(`routine-${r.id}`)} className="text-neutral-400 p-1.5">✎</button>
                      {confirmDelete === `routine-${r.id}` ? (
                        <>
                          <button onClick={() => deleteRoutine(r.id)} className="text-red-400 text-xs px-2 py-1 bg-red-500/10 rounded-md">Confirm</button>
                          <button onClick={() => setConfirmDelete(null)} className="text-neutral-400 text-xs px-2 py-1 bg-neutral-800 rounded-md">Cancel</button>
                        </>
                      ) : (
                        <button onClick={() => setConfirmDelete(`routine-${r.id}`)} className="text-neutral-400 p-1.5">🗑</button>
                      )}
                    </div>
                  </>
                )}
              </div>

              {isExpanded && (
                <>
                  <div className="space-y-1.5">
                    {r.exercises.map((ex, idx) => (
                      <div key={ex.id} className={`flex items-center justify-between rounded-lg px-2 py-2 border border-neutral-800 ${ex.archived ? "bg-neutral-950/50" : "bg-neutral-950"}`}>
                        {manageRenaming === `ex-${ex.id}` ? (
                          <RenameInline initial={ex.name} onSave={(name) => renameExercise(r.id, ex.id, name)} onCancel={() => setManageRenaming(null)} />
                        ) : (
                          <>
                            <div className="flex items-center gap-1 min-w-0">
                              <div className="flex flex-col shrink-0 text-neutral-500">
                                <button onClick={() => moveExercise(r.id, ex.id, -1)} disabled={idx === 0} className={idx === 0 ? "opacity-30" : ""}>▲</button>
                                <button onClick={() => moveExercise(r.id, ex.id, 1)} disabled={idx === r.exercises.length - 1} className={idx === r.exercises.length - 1 ? "opacity-30" : ""}>▼</button>
                              </div>
                              <span className={`text-sm truncate ${ex.archived ? "text-neutral-600 line-through" : "text-neutral-200"}`}>{ex.name}</span>
                            </div>
                            <div className="flex items-center gap-1 shrink-0">
                              <button onClick={() => toggleUnit(r.id, ex.id)} className="text-[10px] font-semibold px-1.5 py-1 rounded-md bg-neutral-900 border border-neutral-800 text-neutral-400 uppercase">
                                {(ex.unit || "seconds") === "reps" ? "Reps" : "Time"}
                              </button>
                              <button onClick={() => setManageRenaming(`ex-${ex.id}`)} className="text-neutral-400 p-1.5">✎</button>
                              {ex.archived ? (
                                <button onClick={() => toggleArchive(r.id, ex.id, false)} className="text-emerald-400 text-xs px-2 py-1">Show</button>
                              ) : (
                                <button onClick={() => toggleArchive(r.id, ex.id, true)} className="text-neutral-400 p-1.5">🙈</button>
                              )}
                            </div>
                          </>
                        )}
                      </div>
                    ))}
                  </div>

                  <div className="flex gap-2 mt-3">
                    <input
                      type="text"
                      placeholder="New exercise"
                      value={newExName[r.id] || ""}
                      onChange={(e) => setNewExName((prev) => ({ ...prev, [r.id]: e.target.value }))}
                      className="flex-1 bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-neutral-200"
                    />
                    <div className="flex shrink-0 rounded-lg overflow-hidden border border-neutral-800">
                      {["seconds", "reps"].map((u) => (
                        <button
                          key={u}
                          onClick={() => setNewExUnit((prev) => ({ ...prev, [r.id]: u }))}
                          className={`px-2 py-2 text-[11px] font-semibold uppercase ${(newExUnit[r.id] || "seconds") === u ? "bg-orange-500 text-neutral-950" : "bg-neutral-950 text-neutral-400"}`}
                        >
                          {u === "reps" ? "Reps" : "Time"}
                        </button>
                      ))}
                    </div>
                    <button onClick={() => addExercise(r.id)} className="w-10 h-10 shrink-0 flex items-center justify-center rounded-lg bg-neutral-800 text-neutral-200">+</button>
                  </div>
                </>
              )}
            </div>
          );
        })}
      </div>

      <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-4 mt-4">
        <div className="text-sm font-semibold text-neutral-300 mb-2">New routine</div>
        <div className="flex gap-2">
          <input
            type="text"
            placeholder="e.g. Leg Day"
            value={newRoutineName}
            onChange={(e) => setNewRoutineName(e.target.value)}
            className="flex-1 bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-neutral-200"
          />
          <button onClick={addRoutine} className="px-4 rounded-lg bg-orange-500 text-neutral-950 text-sm font-semibold">Add</button>
        </div>
      </div>

      <button onClick={loadData} className="w-full mt-4 py-2.5 rounded-lg bg-neutral-800 text-neutral-200 text-sm font-semibold">
        Reload from Sheet
      </button>
    </div>
  );
}

function RenameInline({ initial, onSave, onCancel }) {
  const [val, setVal] = useState(initial);
  return (
    <div className="flex items-center gap-2 flex-1">
      <input autoFocus type="text" value={val} onChange={(e) => setVal(e.target.value)} className="flex-1 bg-neutral-950 border border-orange-500/50 rounded-md px-2 py-1 text-sm text-neutral-100" />
      <button onClick={() => onSave(val)} className="text-emerald-400 p-1">✓</button>
      <button onClick={onCancel} className="text-neutral-400 p-1">✕</button>
    </div>
  );
}

try {
  window.__stage1Booted = true;
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  document.getElementById("boot-error").textContent = "Render error: " + e.message;
  console.error(e);
}
</script>
</body>
</html>
